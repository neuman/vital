name: Android APK

on:
  push:
    branches:
      - 'claude/android-vital-port-**'
      - main
    paths:
      - 'src/**'
      - 'standalone/**'
      - 'third_party/JUCE/**'
      - '.github/workflows/android.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Free up disk space
        run: |
          # Vital + JUCE + NDK toolchains can eat ~20GB during build; the
          # ubuntu-latest runner has prebaked content we don't need.
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android/sdk/ndk/* || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo apt-get clean || true
          df -h / || true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install required SDK + NDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmake;3.22.1" \
            "ndk;26.1.10909125"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Show toolchain versions
        run: |
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/ndk" || true

      - name: Bootstrap Gradle wrapper
        working-directory: standalone/builds/android
        run: gradle wrapper --gradle-version 8.5 --no-daemon

      - name: Build debug APK
        id: build
        working-directory: standalone/builds/android
        env:
          # ANDROID_HOME is exported by setup-android. Use it via shell.
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx5g"
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.1.10909125"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          echo "Using NDK at $ANDROID_NDK_HOME"
          ls "$ANDROID_NDK_HOME" >/dev/null
          # Capture stdout+stderr so we can ship the tail back to the PR
          # comment if it fails (CI logs aren't publicly accessible without auth).
          set -o pipefail
          ./gradlew --no-daemon \
                    assembleDebug \
                    --stacktrace \
                    --info 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: On failure, comment build log tail on the open PR
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set +e
          LOG="$GITHUB_WORKSPACE/build.log"
          if [ ! -f "$LOG" ]; then
            echo "No build log found"
            exit 0
          fi
          # Find the most recent open PR for this branch.
          PR=$(gh pr list --repo "$REPO" --head "${GITHUB_REF_NAME}" --state open --json number --jq '.[0].number')
          if [ -z "$PR" ] || [ "$PR" = "null" ]; then
            echo "No open PR found for branch ${GITHUB_REF_NAME}"
            exit 0
          fi
          echo "Posting failure tail to PR #$PR"
          {
            echo "### CI build failed @ \`${SHA::8}\`"
            echo ""
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "Last 400 lines of \`gradle assembleDebug --info\`:"
            echo ""
            echo '```'
            tail -n 400 "$LOG" | sed 's/```/`\`\`/g'
            echo '```'
          } > /tmp/comment.md
          gh pr comment "$PR" --repo "$REPO" --body-file /tmp/comment.md

      - name: Locate APK
        id: apk
        run: |
          APK=$(find standalone/builds/android/app/build/outputs/apk -name "*.apk" | head -1)
          echo "Found APK: $APK"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "apk_name=$(basename "$APK")" >> "$GITHUB_OUTPUT"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: spectra-debug-apk
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error

      - name: Publish APK to rolling release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
        run: |
          set -euo pipefail
          TAG="android-latest"
          TITLE="Spectra Android (rolling debug build)"
          NOTES=$(cat <<EOF
          Debug APK built from \`${GITHUB_REF_NAME}\` @ ${GITHUB_SHA::8}.
          Built ${GITHUB_RUN_NUMBER} on $(date -u +'%Y-%m-%d %H:%M UTC').

          Sideload only — debug-signed, not Play-Store ready.
          Audio: Oboe. Min SDK 26 (Android 8.0+). ABI: arm64-v8a.
          EOF
          )

          # Replace any existing rolling release with the same tag.
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" "$APK_PATH" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" \
            --prerelease
